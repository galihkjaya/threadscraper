[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threads-comment-scraper"
version = "0.1.0"
description = "Scrape comments and replies from Threads by keyword"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "playwright>=1.40",
]

[project.urls]
Homepage = "https://github.com/galihkjaya/threadscraper"
Repository = "https://github.com/galihkjaya/threadscraper"

[project.scripts]
threads-scraper = "threads_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["threads_scraper*"]
